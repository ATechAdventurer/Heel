name: heel
services:
  relay:
    build: .
    restart: unless-stopped
    init: true
    environment:
      HOST: 127.0.0.1
      PORT: "8787"
      HEEL_DATA_FILE: /data/state.json
      HEEL_ENROLLMENT_FILE: /data/enrollment.json
      HEEL_TRUST_LOOPBACK_PROXY: "1"
    volumes:
      - ./.runtime:/data
    # Caddy shares this network namespace; the relay itself stays on loopback.
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "service:relay"
    depends_on:
      relay:
        condition: service_healthy
        restart: true
    environment:
      HEEL_DOMAIN: ${HEEL_DOMAIN:?Run install.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  caddy_data:
  caddy_config:
