name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci && npm test
      - name: Check installer and containers
        run: |
          bash -n install.sh
          node setup.mjs heel.example.com
          sudo chown -R 1000:1000 .runtime
          docker compose config --quiet
          docker compose up -d --build --wait relay
          docker compose exec -T relay node -e "fetch('http://127.0.0.1:8787/health').then(async r=>{if(!r.ok)process.exit(1);console.log(await r.json())}).catch(()=>process.exit(1))"
          docker run --rm -e HEEL_DOMAIN=heel.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - if: always()
        run: docker compose logs --tail=60; docker compose down
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked
      - run: cargo test --locked --manifest-path ../native/Cargo.toml
        env:
          LD_LIBRARY_PATH: ${{ env.JAVA_HOME }}/lib/server
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Heel-unified-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-test-reports
          path: android/app/build/reports/
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: rustup target add aarch64-apple-ios-sim
      - run: cp Config/Local.xcconfig.example Config/Local.xcconfig
      - run: xcodegen generate
      - run: |
          xcodebuild -project Heel.xcodeproj -scheme Heel \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug test
