name: Heel
options:
  bundleIdPrefix: dev.atechadventure
  deploymentTarget:
    iOS: "16.2"
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.2"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../native/include"

targets:
  Heel:
    type: application
    platform: iOS
    sources:
      - path: Heel
      - path: Shared
    dependencies:
      - target: HeelWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.atechadventure.heel
        INFOPLIST_FILE: Heel/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Heel/Bridging/Heel-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../native/target/ios-xcode"
        OTHER_LDFLAGS: "-llovense_native -framework CoreBluetooth -framework Security -framework CoreHaptics"
    preBuildScripts:
      - name: Build native core (Rust)
        script: |
          "$SRCROOT/../native/build-ios.sh"
        basedOnDependencyAnalysis: false

  HeelWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HeelWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.atechadventure.heel.widgets
        INFOPLIST_FILE: HeelWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  HeelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeelTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.atechadventure.heel.tests
    dependencies:
      - target: Heel

schemes:
  Heel:
    build:
      targets:
        Heel: all
    test:
      targets:
        - HeelTests
    run:
      config: Debug
