[package]
name = "lovense-native"
version = "0.4.0"
edition = "2021"
publish = false

[lib]
name = "lovense_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
buttplug = { version = "=9.0.9", default-features = false, features = ["client", "server", "serialize-json", "tokio-runtime"] }
futures = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
jni = "=0.19.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[target.'cfg(target_os = "android")'.dependencies]
buttplug = { version = "=9.0.9", default-features = false, features = ["btleplug-manager"] }
btleplug = "=0.11.8"
jni-utils = "=0.1.1"

[target.'cfg(target_os = "ios")'.dependencies]
buttplug = { version = "=9.0.9", default-features = false, features = ["btleplug-manager"] }
btleplug = "=0.11.8"

[dev-dependencies]
jni = { version = "=0.19.0", features = ["invocation"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = "debuginfo"
